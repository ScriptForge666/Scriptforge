name: Auto Update Repo Tree
# 触发时机：推送代码到main分支 / 手动在Actions页面运行
on:
  push:
  
  workflow_dispatch:

# 授予读写代码权限，才能提交文件
permissions:
  contents: write

jobs:
  generate-tree:
    runs-on: windows-latest
    steps:
      - name: 完整拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 tree-node-cli
        run: npm install -g tree-node-cli

      - name: 输出```到repo_tree.md
        run: echo '```' > repo_tree.md

      - name: 生成目录树，覆盖 repo_tree.md
        run: tree . -L 8 --ignore ".git,x64,x86,Debug,Release,.vs,GeneratedTools" >> repo_tree.md

      - name: 输出```到repo_tree.md
        run: echo '```' >> repo_tree.md

      - name: PowerShell 更新README目录树区块
        shell: pwsh
        run: |
          # 1. 检查临时tree文件
          $treeFile = "repo_tree.md"
          if (-not (Test-Path $treeFile)) {
              Write-Host "⚠️ $treeFile 不存在，直接跳过更新"
              exit 0
          }
          
          # 读取内容
          $treeText = Get-Content $treeFile -Raw
          $readmePath = "README.md"
          $originReadme = Get-Content $readmePath -Raw
          $pattern = '(?s)(<!-- TREE_START -->).*?(<!-- TREE_END -->)'

          # 2. 校验标记区块是否存在，防止误清空文档
          if (-not ($originReadme -match $pattern)) {
            Write-Error "❌ README.md 未找到 <!-- TREE_START --> / <!-- TREE_END --> 成对标记，终止执行"
            exit 1
          }

          # 构造替换文本（单引号保留正则捕获组 ${1} ${2}）
          $replaceStr = '${1}' + "`n````n" + $treeText + "`n````n" + '${2}'
          $newReadme = $originReadme -replace $pattern, $replaceStr
          

          # 写入新README（UTF8无BOM，兼容Git）
          [System.IO.File]::WriteAllText($readmePath, $newReadme, [System.Text.Encoding]::UTF8)
          Remove-Item $treeFile -Force
          Write-Host "✅ README 目录树区块已更新完成"
      - name: 自动提交变更
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto refresh repo directory tree"
          # 只提交目录树文件，其余文件忽略
          file_pattern: repo_tree.md